# Publish ExifCleaner prebuilt RPM to Fedora COPR
name: ExifCleaner Fedora COPR CI

on:
  schedule:
    # ABD Doğu Saati'ne (EST) göre yaklaşık 12:00 (Öğle) ve 17:00 (İş çıkışı)
    - cron: "0 17,22 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force a COPR rebuild even if the version is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

env:
  COPR_PROJECT: ExifCleaner..
  COPR_USERNAME: universish
  COPR_URL: https://copr.fedorainfracloud.org
  REPO_DEV: szTheory
  REPO_NAME: exifcleaner
  PACKAGE_NAME: exifcleaner

jobs:
  CheckRelease:
    name: 1. Aşama - Sürüm Kontrolü
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.step_version.outputs.VERSION }}
      SHOULD_BUILD: ${{ steps.step_check.outputs.SHOULD_BUILD }}
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Get latest GitHub version
        id: step_version
        run: |
          latest_release_tag=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO_DEV/$REPO_NAME/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$latest_release_tag" ]; then echo "ERROR: tag empty"; exit 1; fi
          echo "VERSION=$latest_release_tag" >> "$GITHUB_OUTPUT"
      - name: Check latest COPR version
        id: step_check
        run: |
          # COPR API'den mevcut sürümü sorgula
          response=$(curl -fsS "https://copr.fedorainfracloud.org/api_3/build/list?ownername=${{ env.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.PACKAGE_NAME }}")
          LATEST_COPR=$(printf '%s\n' "$response" | jq -r '[.items | sort_by(.id) | reverse[] | select(.state == "succeeded") | .source_package.version] | first // empty')
          NEW_TAG="${{ steps.step_version.outputs.VERSION }}"
          GIT_VERSION=$(echo "$NEW_TAG" | sed 's/^v//')
          
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "SHOULD_BUILD=true" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST_COPR" != "$GIT_VERSION" ]; then
            echo "Yeni sürüm bulundu! COPR: $LATEST_COPR, GitHub: $GIT_VERSION"
            echo "SHOULD_BUILD=true" >> "$GITHUB_OUTPUT"
          else
            echo "Güncel sürüm zaten paketlenmiş ($GIT_VERSION). İşlem sonlandırılıyor."
            echo "SHOULD_BUILD=false" >> "$GITHUB_OUTPUT"
          fi

  BuildAndPublish:
    name: 2. Aşama - Paketleme ve Yayınlama
    needs: CheckRelease
    if: needs.CheckRelease.outputs.SHOULD_BUILD == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install git and dependencies
        run: dnf install -y -q git copr-cli python3 gawk jq curl rpm-build binutils cpio chrpath rpmdevtools desktop-file-utils appstream
      - name: Checkout local
        uses: actions/checkout@v4
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Patch spec and metainfo version
        run: |
          version_no_v=$(echo "${{ needs.CheckRelease.outputs.VERSION }}" | sed 's/^v//')
          sed -i "s/^Version:.*/Version:        ${version_no_v}/" specs/exifcleaner.spec
          if [ -f sources/com.exifcleaner.exifcleaner.metainfo.xml ]; then
            sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${version_no_v}\" date=\"$(date +%F)\"|" sources/com.exifcleaner.exifcleaner.metainfo.xml
          fi
      - name: Configure copr-cli
        run: |
          mkdir -p $HOME/.config
          cat <<EOF > $HOME/.config/copr
          [copr-cli]
          login = ${{ secrets.COPR_BUILD_L }}
          username = ${{ env.COPR_USERNAME }}
          token = ${{ secrets.COPR_BUILD_T }}
          copr_url = ${{ env.COPR_URL }}
          EOF
      - name: Build SRPM and submit to COPR
        env:
          VERSION: ${{ needs.CheckRelease.outputs.VERSION }}
        run: |
          rpmdev-setuptree
          cp sources/com.exifcleaner.exifcleaner.metainfo.xml $HOME/rpmbuild/SOURCES/ || true
          cp specs/exifcleaner.spec $HOME/rpmbuild/SPECS/
          cd $HOME/rpmbuild/SPECS
          spectool -g -R exifcleaner.spec
          rpmbuild -bs exifcleaner.spec
          SRPM=$(ls $HOME/rpmbuild/SRPMS/exifcleaner-*.src.rpm | head -1)
          echo "Submitting $SRPM to COPR"
          copr-cli build --nowait ${{ env.COPR_PROJECT }} "$SRPM"
